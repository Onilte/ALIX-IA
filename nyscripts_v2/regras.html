<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regras · NyScripts_Sources</title>
<meta name="description" content="Regras do Discord do NyScripts_Sources: gerais, leaks e mapas, tickets, parceria e uso do bot.">
<meta name="theme-color" content="#06070a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='17' font-weight='bold' text-anchor='middle' fill='%2304070f'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Regras da comunidade</span>
        <h2>Regras do Discord</h2>
        <p>Leia com atenção — desconhecer as regras não isenta de punição. Clique em cada bloco para abrir.</p>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:22px" class="reveal">
        <button class="btn btn-ghost btn-sm" id="toggle-all" type="button">Expandir tudo</button>
      </div>

      <div id="rules"></div>

      <div class="callout reveal" style="margin-top:26px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><strong>Aviso final:</strong> a staff pode punir qualquer comportamento prejudicial mesmo que não esteja listado acima. Ao entrar no servidor, você concorda com todas as regras.</div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  Ny.boot('regras');

  var RULES = [
    {
      title: 'Regras gerais do servidor',
      items: [
        ['Respeito', 'trate todos com respeito. Insultos, preconceito, racismo, homofobia ou qualquer discriminação resulta em ban permanente.'],
        ['Sem spam', 'nada de mensagens repetidas, flood ou excesso de emojis. A punição é mute.'],
        ['Sem NSFW', 'conteúdo adulto, violento ou perturbador é proibido.'],
        ['Português', 'idioma oficial do servidor nos canais gerais.'],
        ['Sem divulgação', 'proibido divulgar outros servidores ou links sem autorização da staff.'],
        ['Identidade', 'não se passe por outros membros, pela staff ou pelo bot.']
      ]
    },
    {
      title: 'Leaks e mapas',
      items: [
        ['Uso pessoal', 'mapas e materiais são para uso pessoal. Proibido revender ou redistribuir sem autorização.'],
        ['Créditos', 'ao usar qualquer material daqui, dê os devidos créditos.'],
        ['Modificações', 'são permitidas, mas não podem ser distribuídas como originais.'],
        ['Pedidos', 'sempre no canal correto, senão são ignorados.'],
        ['Escopo', 'foco em mapas do Exército Brasileiro e jogos do Roblox.']
      ]
    },
    {
      title: 'Atendimento e tickets',
      items: [
        ['Um ticket por vez', 'abrir vários ao mesmo tempo fecha todos na hora.'],
        ['Seja claro', 'quanto mais detalhes de cara, mais rápido o atendimento.'],
        ['Respeite a staff', 'grosseria fecha o ticket e pode gerar punição.'],
        ['Sem ticket desnecessário', 'dúvidas simples vão nos canais gerais.'],
        ['Aguarde', 'a staff atende assim que possível.']
      ]
    },
    {
      title: 'Parceria',
      items: [
        ['Mínimo de membros', 'o servidor precisa de pelo menos 100 membros.'],
        ['Servidor ativo', 'servidores inativos não são aceitos.'],
        ['Sem conteúdo impróprio', 'nada de NSFW, ilegal ou que viole os termos do Discord.'],
        ['Reciprocidade', 'a parceria é mútua, seu servidor também divulga.'],
        ['Respeito', 'desrespeito encerra a parceria na hora.'],
        ['Revisão', 'parcerias são revisadas mensalmente.']
      ]
    },
    {
      title: 'Uso do bot',
      items: [
        ['Canal correto', 'use os comandos apenas no canal de comandos.'],
        ['Sem abuso', 'spam de comandos gera mute.'],
        ['Sem exploits', 'tentar explorar bugs do bot é ban permanente.'],
        ['Respeite o bot', 'não tente enganar ou manipular de forma maliciosa.'],
        ['Comandos de moderação', 'exclusivos da staff.']
      ]
    }
  ];

  Ny.el('rules').innerHTML = RULES.map(function (rule, i) {
    return '<section class="rule reveal' + (i === 0 ? ' is-open' : '') + '">' +
      '<button class="rule-head" type="button" aria-expanded="' + (i === 0) + '">' +
        '<span class="rule-num">' + (i + 1) + '</span>' +
        '<h3>' + Ny.esc(rule.title) + '</h3>' +
        '<span class="chev">' + Ny.ICON.chevron + '</span>' +
      '</button>' +
      '<div class="rule-body"><div><ul>' +
        rule.items.map(function (it) {
          return '<li><strong>' + Ny.esc(it[0]) + '</strong> — ' + Ny.esc(it[1]) + '</li>';
        }).join('') +
      '</ul></div></div>' +
    '</section>';
  }).join('');

  Ny.all('.rule-head').forEach(function (head) {
    head.addEventListener('click', function () {
      var open = head.parentElement.classList.toggle('is-open');
      head.setAttribute('aria-expanded', String(open));
    });
  });

  var toggleAll = Ny.el('toggle-all');
  toggleAll.addEventListener('click', function () {
    var expand = toggleAll.textContent.indexOf('Expandir') === 0;
    Ny.all('.rule').forEach(function (r) {
      r.classList.toggle('is-open', expand);
      r.querySelector('.rule-head').setAttribute('aria-expanded', String(expand));
    });
    toggleAll.textContent = expand ? 'Recolher tudo' : 'Expandir tudo';
  });

  Ny.reveal();
</script>
</body>
</html>
